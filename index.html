<!doctype html>
<html lang="pt-BR">
  <!--
    =====================================================
    SISTEMA DE GERENCIAMENTO DE PEDIDOS
    =====================================================
    Arquivo: index.html
    Descrição: Estrutura principal do sistema
    
    Estrutura:
    - Cabeçalho com metadados
    - Corpo com formulários e tabelas
    - Inclusão de arquivos CSS e JS externos
    
    Autor: Sistema de Pedidos
    Data: 27/04/2026
    =====================================================
-->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Gerenciamento de Pedidos</title>

    <!-- Arquivo de estilos externos -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
        =====================================================
        CONTAINER PRINCIPAL
        Área central que contém todos os elementos do sistema
        =====================================================
    -->
    <div class="container">
      <h1>Sistema de Gerenciamento de Pedidos</h1>

      <!--
            =====================================================
            SEÇÃO 1: FORMULÁRIO DE CADASTRO
            Permite ao ADM criar novos pedidos
            =====================================================
        -->
      <div class="card no-print">
        <h2>Novo Pedido</h2>

        <!--
                Seletor de tipo de pedido
                Dois botões para escolher entre:
                - Transporte: rotas com escolas e horários
                - Alimentação: locais com quantidade
            -->
        <div class="type-selector">
          <div
            class="type-option selected"
            data-type="transporte"
            onclick="selectType('transporte')"
          >
            <h3>🚌 Transporte</h3>
            <p>Rotas com escolas e horários</p>
          </div>
          <div
            class="type-option"
            data-type="alimentacao"
            onclick="selectType('alimentacao')"
          >
            <h3>🍽️ Alimentação</h3>
            <p>Locais com quantidade</p>
          </div>
        </div>

        <!--
                =====================================================
                SEÇÃO DE TRANSPORTE
                Campos para cadastrar rotas de transporte
                =====================================================
            -->
        <div id="transporte-section" class="section active">
          <div class="form-group">
            <label>Descrição do Pedido</label>
            <input
              type="text"
              id="transporte-descricao"
              placeholder="Ex: Transporte escolar mês de maio"
            />
          </div>

          <!-- Container dinâmico para adicionar rotas -->
          <div class="item-list" id="rotas-list">
            <!-- Rotas serão adicionadas via JavaScript -->
          </div>

          <!-- Botão para adicionar nova rota -->
          <button class="btn btn-primary" onclick="addRota()">
            + Adicionar Rota
          </button>
        </div>

        <!--
                =====================================================
                SEÇÃO DE ALIMENTAÇÃO
                Campos para cadastrar locais de alimentação
                =====================================================
            -->
        <div id="alimentacao-section" class="section">
          <div class="form-group">
            <label>Descrição do Pedido</label>
            <input
              type="text"
              id="alimentacao-descricao"
              placeholder="Ex: Alimentação evento dia dos pais"
            />
          </div>

          <!-- Container dinâmico para adicionar locais -->
          <div class="item-list" id="locais-list">
            <!-- Locais serão adicionados via JavaScript -->
          </div>

          <!-- Botão para adicionar novo local -->
          <button class="btn btn-primary" onclick="addLocal()">
            + Adicionar Local
          </button>
        </div>

        <!-- Botão para salvar o pedido -->
        <div style="margin-top: 20px">
          <button class="btn btn-success" onclick="salvarPedido()">
            💾 Salvar Pedido
          </button>
        </div>
      </div>

      <!--
            =====================================================
            SEÇÃO 2: TABELA DE PEDIDOS
            Exibe todos os pedidos cadastrados
            =====================================================
        -->
      <div class="card">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
          "
        >
          <h2>Pedidos Cadastrados</h2>
          <button class="btn btn-warning no-print" onclick="imprimirPedidos()">
            🖨️ Imprimir
          </button>
        </div>

        <!-- Tabela responsiva com lista de pedidos -->
        <div class="table-container">
          <table id="pedidos-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Tipo</th>
                <th>Descrição</th>
                <th>Data</th>
                <th>Detalhes</th>
                <th class="no-print">Ações</th>
              </tr>
            </thead>
            <tbody id="pedidos-tbody">
              <!-- Pedidos serão inseridos via JavaScript -->
            </tbody>
          </table>
        </div>

        <!-- Mensagem exibida quando não há pedidos -->
        <div id="empty-state" class="empty-state">
          <p>Nenhum pedido cadastrado ainda.</p>
        </div>
      </div>
    </div>

    <!--
        =====================================================
        MODAL DE DETALHES
        Popup para exibir informações completas de um pedido
        =====================================================
    -->
    <div id="details-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Detalhes do Pedido</h3>
          <button class="close-modal" onclick="closeModal()">&times;</button>
        </div>
        <div id="modal-body">
          <!-- Conteúdo dinâmico inserido via JavaScript -->
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
